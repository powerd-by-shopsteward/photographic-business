<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio App</title>
    <!-- Google Font for Header (Cinzel - Luxury Look) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div id="login-screen" class="login-page">
    <form id="login-form" class="login-box">
      <h1>Studio Login</h1>
      <input id="login-email" type="email" placeholder="Email"
             required autocomplete="email">
      <input id="login-password" type="password" placeholder="Password"
             required autocomplete="current-password">
      <button type="submit" style="width:100%">Login</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

    <!-- ============ APP SHELL ============ -->
  <div id="app-shell" style="display:none">

       <!-- Top Header -->
    <header class="top-header">
      <div class="header-left"></div> <!-- Empty spacer to keep center perfect -->
      
      <div class="header-title">
        <h1 id="header-studio-name">Studio Name</h1>
      </div>

      <div class="header-right">
        <span id="user-name" class="user-name"></span>
        
        <!-- Studio Logo as Profile Button -->
        <button id="profile-btn" class="icon-btn" title="Profile">
          <img id="header-profile-logo" src="" style="display:none;">
          <span id="profile-fallback-emoji" style="font-size: 20px;">👤</span>
        </button>

        <!-- Custom Settings Icon -->
        <button id="settings-btn" class="icon-btn" title="Settings" data-role="owner">
          <img src="images/settings.png" style="width: 24px; height: 24px; object-fit: contain;">
        </button>
        
        <button id="logout-btn" class="logout-btn">Logout</button>
      </div>
    </header>

    <!-- Floating Pill Sidebar -->
    <aside class="sidebar-pill">
      <nav id="main-nav">
        <a href="#dashboard" data-screen="dashboard" data-role="owner">
          <img src="images/dashboard.png" class="nav-icon" alt="D">
          <span>Dashboard</span>
        </a>
        <a href="#live-projects" data-screen="live-projects">
          <img src="images/live-projects.png" class="nav-icon" alt="L">
          <span>Live Projects</span>
        </a>
        <a href="#projects" data-screen="projects">
          <img src="images/projects.png" class="nav-icon" alt="P">
          <span>All Projects</span>
        </a>
        <a href="#members" data-screen="members" data-role="owner">
          <img src="images/members.png" class="nav-icon" alt="M">
          <span>Members</span>
        </a>
        <a href="#clients" data-screen="clients" data-role="owner">
          <img src="images/clients.png" class="nav-icon" alt="C">
          <span>Clients</span>
        </a>
        <a href="#gadgets" data-screen="gadgets" data-role="owner">
          <img src="images/gadgets.png" class="nav-icon" alt="G">
          <span>Gadgets</span>
        </a>
        <a href="#invoices" data-screen="invoices" data-role="owner">
          <img src="images/invoices.png" class="nav-icon" alt="I">
          <span>Invoices</span>
        </a>
        <a href="#agreements" data-screen="agreements" data-role="owner">
          <img src="images/agreements.png" class="nav-icon" alt="A">
          <span>Agreements</span>
        </a>
        <a href="#reports" data-screen="reports" data-role="owner">
          <img src="images/reports.png" class="nav-icon" alt="R">
          <span>Reports</span>
        </a>
        <a href="#studio-value" data-screen="studio-value" data-role="owner">
          <img src="images/studio-value.png" class="nav-icon" alt="S">
          <span>Studio Value</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="content">
      <section id="screen-dashboard"    class="screen-content"></section>
      <section id="screen-projects"     class="screen-content"></section>
      <section id="screen-project"      class="screen-content"></section>
      <section id="screen-members"      class="screen-content"></section>
      <section id="screen-clients"      class="screen-content"></section>
      <section id="screen-gadgets"      class="screen-content"></section>
      <section id="screen-invoices"     class="screen-content"></section>
      <section id="screen-invoice"      class="screen-content"></section>
      <section id="screen-agreements"   class="screen-content"></section>
      <section id="screen-agreement"    class="screen-content"></section>
      <section id="screen-reports"      class="screen-content"></section>
      <section id="screen-studio-value" class="screen-content"></section>
      <section id="screen-profile"      class="screen-content"></section>
      <section id="screen-settings"     class="screen-content"></section>
    </main>
  </div>

    window.SUPABASE_ANON = 'sb_publishable_ZUMIXO2a90bsYJPZqEFp8A_h7FqZZzW';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
